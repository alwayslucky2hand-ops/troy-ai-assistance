<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GrowthX | 時間贖回系統</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* 賈伯斯極簡美學設計系統 */
    :root {
      --bg-color: #F5F5F7; --surface: rgba(255, 255, 255, 0.85);
      --text-main: #1D1D1F; --text-sec: #86868B;
      --accent: #0071E3; --accent-hover: #0058B0;
      --radius-lg: 24px; --radius-sm: 12px;
    }
    body {
      background-color: var(--bg-color); color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      margin: 0; padding: 20px 16px; -webkit-font-smoothing: antialiased; line-height: 1.5;
    }
    .container { max-width: 720px; margin: 0 auto; padding-bottom: 60px; }
    
    .glass-card {
      background: var(--surface); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-radius: var(--radius-lg); padding: 32px; box-shadow: 0 8px 32px rgba(0,0,0,0.04);
      margin-bottom: 24px; transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
    }
    
    h1, h2, h3 { font-weight: 600; letter-spacing: -0.02em; margin: 0 0 8px 0; }
    p { color: var(--text-sec); margin-top: 0; font-size: 15px; }
    
    input {
      width: 100%; padding: 16px; border-radius: var(--radius-sm); border: 1px solid rgba(0,0,0,0.1);
      font-size: 16px; margin-bottom: 16px; box-sizing: border-box; background: #FFF;
      transition: all 0.2s; outline: none;
    }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.1); }
    
    .btn {
      background: var(--accent); color: #FFF; border: none; width: 100%;
      padding: 16px 24px; border-radius: 98px; font-size: 16px; font-weight: 500;
      cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn:hover { background: var(--accent-hover); transform: scale(0.98); }
    .btn-stop { background: #FF3B30; }
    .btn-stop:hover { background: #D70015; }
    .btn-outline { background: transparent; color: var(--text-main); border: 1px solid rgba(0,0,0,0.1); }
    
    /* 視訊區塊 */
    .video-container {
      position: relative; width: 100%; border-radius: var(--radius-lg); overflow: hidden;
      background: #000; margin-bottom: 24px; aspect-ratio: 16/9; box-shadow: 0 12px 40px rgba(0,0,0,0.15);
    }
    video { width: 100%; height: 100%; object-fit: cover; }
    .rec-indicator {
      position: absolute; top: 16px; right: 16px; background: rgba(255, 59, 48, 0.9); backdrop-filter: blur(4px);
      color: #FFF; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600;
      display: flex; align-items: center; gap: 6px; animation: pulse 2s infinite; z-index: 10;
    }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }

    /* 表格設計：保證複製貼上的格式 */
    .table-wrapper { overflow-x: auto; border: 1px solid rgba(0,0,0,0.08); border-radius: var(--radius-sm); margin-bottom: 24px; background: #FFF; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; white-space: nowrap; }
    th { background: #F5F5F7; padding: 12px 16px; font-weight: 500; color: var(--text-sec); border-bottom: 1px solid rgba(0,0,0,0.08); border-right: 1px solid rgba(0,0,0,0.04); }
    td { padding: 12px 16px; border-bottom: 1px solid rgba(0,0,0,0.04); border-right: 1px solid rgba(0,0,0,0.04); }
    
    /* 階段進度條 */
    .stepper { display: flex; justify-content: center; gap: 8px; margin-bottom: 32px; }
    .step-dot { width: 32px; height: 6px; border-radius: 3px; background: rgba(0,0,0,0.1); transition: 0.3s; }
    .step-dot.active { background: var(--accent); }
    
    /* 狀態提示 */
    .status-text { text-align: center; font-size: 14px; color: var(--text-sec); margin-top: 16px; min-height: 20px; font-weight: 500;}
  </style>
</head>
<body>

<div class="container">
  
  <div id="loginView" class="glass-card" style="margin-top: 10vh; max-width: 400px; margin-left: auto; margin-right: auto; text-align: center;">
    <i data-lucide="infinity" style="width: 48px; height: 48px; color: var(--accent); margin-bottom: 16px;"></i>
    <h2>GrowthX</h2>
    <p>時間贖回，從精準對齊開始</p>
    <div style="margin-top: 32px;">
      <input type="email" id="email" placeholder="輸入工作信箱">
      <button class="btn" id="btnSendCode" onclick="sendOTP()">取得系統權限</button>
      <div id="otpSection" style="display:none; margin-top: 24px;">
        <input type="text" id="otp" placeholder="輸入 6 位數驗證碼" style="text-align: center; letter-spacing: 6px; font-size: 20px; font-weight: 600;">
        <button class="btn btn-outline" onclick="verifyOTP()">驗證並進入</button>
      </div>
    </div>
  </div>

  <div id="mainView" style="display:none;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px;">
      <h2 style="margin:0;">系統架構師</h2>
      <span id="userBadge" style="font-size: 13px; font-weight: 500; color: var(--text-sec); background: rgba(0,0,0,0.05); padding: 6px 12px; border-radius: 16px;"></span>
    </div>

    <div class="stepper">
      <div class="step-dot active" id="dot1"></div>
      <div class="step-dot" id="dot2"></div>
      <div class="step-dot" id="dot3"></div>
    </div>

    <div class="glass-card" id="recordCard">
      <h3 id="stageTitle">第一階段：現況調查</h3>
      <p id="stageDesc">請描述目前的工作流程與最大痛點。</p>
      
      <div class="video-container" id="videoUI" style="display:none;">
        <div class="rec-indicator" id="recIndicator"><div style="width:8px;height:8px;background:#FFF;border-radius:50%;"></div>錄製中</div>
        <video id="player" autoplay muted playsinline></video>
      </div>

      <button class="btn" id="btnStart" onclick="startStage()"><i data-lucide="video"></i> 開始錄製</button>
      <button class="btn btn-stop" id="btnStop" onclick="stopStage()" style="display:none;"><i data-lucide="square"></i> 結束錄製並生成報告</button>
      <div class="status-text" id="statusMsg"></div>
    </div>

    <div class="glass-card" id="resultCard" style="display:none;">
      <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h3>AI 規格化產出</h3>
        <button class="btn btn-outline" style="width:auto; padding: 8px 16px; font-size: 14px;" onclick="copyTable()"><i data-lucide="copy" style="width:16px;"></i> 一鍵複製表格</button>
      </div>
      
      <div class="table-wrapper" id="tableOutput"></div>
      <p style="font-size: 12px; color: var(--text-sec); text-align: center; margin-bottom: 24px;">複製後，請直接至 Google 試算表對應位置貼上 (Ctrl+V)</p>
      
      <button class="btn" id="btnNext" onclick="nextStage()">進入下一階段設計</button>
    </div>

  </div>
</div>

<script>
  lucide.createIcons();
  const GAS_URL = "https://script.google.com/macros/s/AKfycbxAF2qmiQwctl4F-X1x56BxlU4BxZhAtnAJudE8u7hmsw_xiqbc1B-7Px_NtFoKk6kv2g/exec"; // ⚠️ 請務必替換為你的網址
  
  let user = null, stream = null, mediaRecorder = null;
  let currentStage = 1;
  let stageData = { 1: null, 2: null, 3: null };
  let currentPostInfo = null;
  let chunkInterval, chunkIndex = 1;

  async function api(payload) {
    try {
      const res = await fetch(GAS_URL, { method: "POST", body: JSON.stringify(payload) });
      return await res.json();
    } catch(e) { alert("網路連線錯誤，請重試。"); throw e; }
  }

  // === 登入流程 ===
  async function sendOTP() {
    const email = document.getElementById('email').value;
    if(!email) return;
    document.getElementById('btnSendCode').innerHTML = '發送中...';
    await api({ action: "sendCode", email });
    document.getElementById('btnSendCode').style.display = 'none';
    document.getElementById('otpSection').style.display = 'block';
  }

  async function verifyOTP() {
    const email = document.getElementById('email').value;
    const code = document.getElementById('otp').value;
    const res = await api({ action: "verifyCode", email, code });
    if(res.status === 'success') {
      user = res.data;
      document.getElementById('loginView').style.display = 'none';
      document.getElementById('mainView').style.display = 'block';
      document.getElementById('userBadge').innerText = user.email.split('@')[0];
    } else { alert("驗證碼錯誤或過期"); }
  }

  // === 錄影與 AI 處理 ===
  async function startStage() {
    document.getElementById('btnStart').style.display = 'none';
    document.getElementById('videoUI').style.display = 'block';
    document.getElementById('statusMsg').innerText = "系統安全連線中...";
    
    // 強制 360p 降低頻寬負載
    stream = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 640 }, height: { ideal: 360 }, facingMode: "user" }, audio: true });
    document.getElementById('player').srcObject = stream;
    
    const res = await api({ action: "initRecord", email: user.email, stage: currentStage });
    currentPostInfo = res.data;
    
    document.getElementById('btnStop').style.display = 'flex';
    document.getElementById('statusMsg').innerText = "正在錄製與即時建檔分析...";
    
    chunkIndex = 1;
    startChunking();
  }

  function startChunking() {
    mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
    let chunks = [];
    mediaRecorder.ondataavailable = e => chunks.push(e.data);
    mediaRecorder.onstop = () => {
      if(chunks.length > 0) {
        const reader = new FileReader();
        reader.readAsDataURL(new Blob(chunks, { type: 'video/webm' }));
        reader.onloadend = () => {
          api({ action: "processChunk", base64Data: reader.result.split(',')[1], mimeType: 'video/webm', folderId: currentPostInfo.folderId, rowIndex: currentPostInfo.rowIndex, chunkIndex: chunkIndex++ });
        };
      }
    };
    mediaRecorder.start();
    chunkInterval = setTimeout(() => { if(mediaRecorder.state === "recording") { mediaRecorder.stop(); startChunking(); } }, 60000); // 1分鐘切片
  }

  async function stopStage() {
    clearTimeout(chunkInterval);
    if(mediaRecorder && mediaRecorder.state === "recording") mediaRecorder.stop();
    if(stream) stream.getTracks().forEach(t => t.stop());
    
    document.getElementById('btnStop').style.display = 'none';
    document.getElementById('videoUI').style.display = 'none';
    document.getElementById('statusMsg').innerHTML = '<i data-lucide="loader" class="lucide-spin" style="width:16px; vertical-align:middle;"></i> AI 正在進行結構化轉譯，這可能需要幾十秒鐘...';
    lucide.createIcons();

    // 呼叫 AI 總結，並將前面的階段資料一併送入做脈絡對齊
    const res = await api({ 
      action: "finalizeStage", 
      rowIndex: currentPostInfo.rowIndex, 
      email: user.email, 
      stage: currentStage,
      previousData: stageData
    });
    
    stageData[currentStage] = res.data;
    renderTable(res.data, currentStage);
    
    document.getElementById('statusMsg').innerText = "";
    document.getElementById('recordCard').style.display = 'none';
    document.getElementById('resultCard').style.display = 'block';
  }

  // === 精確 HTML 表格渲染 (對齊 CSV) ===
  function renderTable(data, stage) {
    let html = `<table id="copyTarget">`;
    if (stage === 1) {
      html += `<tr><th>導入前-步驟</th><th>簡要敘述</th><th>詳細操作描述</th><th>運用工具有哪些</th><th>資料來源有哪些</th><th>執行人</th><th>品管人</th></tr>`;
      data.workflow.forEach(w => html += `<tr><td>${w.step}</td><td>${w.desc}</td><td>${w.detail}</td><td>${w.tools}</td><td>${w.sources}</td><td>${w.executor}</td><td>${w.qc}</td></tr>`);
      // 為了複製貼上方便，Q&A 在前端分開顯示
      html += `<tr><th colspan="7" style="background:#E5E5EA; text-align:center;">痛點診斷 QA</th></tr>`;
      data.qa.forEach(q => html += `<tr><td style="font-weight:600;">${q.q_num}</td><td colspan="6">${q.question}<br><span style="color:var(--accent);">${q.answer}</span></td></tr>`);
    } 
    else if (stage === 2) {
      html += `<tr><th>調查項目</th><th>諮詢提問</th><th>調查內容</th></tr>`;
      data.requirements.forEach(r => html += `<tr><td>${r.item}</td><td>${r.question}</td><td>${r.content}</td></tr>`);
    } 
    else if (stage === 3) {
      // 完整的 20 欄位
      html += `<tr><th>系統總名稱</th><th>系統分頁名稱</th><th>頁籤名稱</th><th>區塊名稱</th><th>瀏覽看/聽什麼？</th><th>需要輸入什麼？</th><th>需要點選什麼？</th><th>需要產出什麼？</th><th>需要什麼功能？</th><th>AI如何運作？</th><th>不想要看到什麼？</th><th>要避免發生什麼？</th><th>誰可以編輯使用？</th><th>誰能單純檢視？</th><th>多媒體檔從哪載入？</th><th>多媒體檔存入哪裡？</th><th>讀取資料取自哪裡？</th><th>產出資料寫入哪裡？</th><th>產出要建檔在哪裡？</th><th>要串接什麼執行什麼？</th></tr>`;
      data.specs.forEach(s => {
        html += `<tr><td>${s.sys_name}</td><td>${s.page_name}</td><td>${s.tab_name}</td><td>${s.block_name}</td><td>${s.watch}</td><td>${s.input}</td><td>${s.click}</td><td>${s.output}</td><td>${s.func}</td><td>${s.ai_logic}</td><td>${s.not_see}</td><td>${s.avoid}</td><td>${s.editor}</td><td>${s.viewer}</td><td>${s.media_in}</td><td>${s.media_out}</td><td>${s.data_in}</td><td>${s.data_out}</td><td>${s.db_loc}</td><td>${s.api_exec}</td></tr>`;
      });
    }
    html += `</table>`;
    document.getElementById('tableOutput').innerHTML = html;
  }

  // 一鍵完美複製
  function copyTable() {
    const el = document.getElementById('copyTarget');
    const range = document.createRange();
    const sel = window.getSelection();
    sel.removeAllRanges();
    range.selectNodeContents(el);
    sel.addRange(range);
    document.execCommand('copy');
    sel.removeAllRanges();
    alert("✅ 規格表格已完美複製！\n請切換至 Google 試算表，點選 A2 儲存格並貼上 (Ctrl+V / Cmd+V)。");
  }

  // 狀態流轉控制
  function nextStage() {
    if(currentStage === 3) {
      alert("🎉 恭喜！系統三大核心規格書已全數建檔完畢！\n您已經完成從現況到系統落地的 0-1 架構。");
      return;
    }
    currentStage++;
    document.getElementById(`dot${currentStage}`).classList.add('active');
    
    const titles = ["", "第一階段：現況調查", "第二階段：老闆需求書", "第三階段：產品規格書"];
    const descs = ["", "", "結合第一階段的痛點，口述系統能解決什麼核心商業問題 (5W2H)。", "結合前兩階段的脈絡，具體口述系統介面的 UI 操作與 AI 邏輯。"];
    
    document.getElementById('stageTitle').innerText = titles[currentStage];
    document.getElementById('stageDesc').innerText = descs[currentStage];
    
    document.getElementById('resultCard').style.display = 'none';
    document.getElementById('recordCard').style.display = 'block';
    document.getElementById('btnStart').style.display = 'flex';
    if(currentStage === 3) document.getElementById('btnNext').innerText = "完成系統建構";
  }
</script>
</body>
</html>
